# Cardano P2P Node Configuration

# network: mainnet | preview | preprod | sanchonet
network: mainnet

# Local address to listen on for inbound connections.
# Set to "" to disable inbound (outbound-only mode).
listenAddr: "0.0.0.0:3000"

# Upstream peers to always maintain persistent outbound connections to.
# Add multiple well-known relay nodes for redundancy and lower latency.
staticPeers:
  - "backbone.cardano-mainnet.iohk.io:3001"
  - "backbone.mainnet.emurgornd.com:3000"
  - "backbone.mainnet.cardanofoundation.org:3001"

# ── Connection limits ─────────────────────────────────────────────────────────
# Maximum simultaneous inbound connections.
# More inbound peers means more chances to build upstreamyness/fetchyness scores.
# Each connection uses ~2 MB of RAM at steady state.
maxInbound: 50

# Maximum simultaneous outbound connections.
# Keep this proportional to the number of staticPeers.
maxOutbound: 10

# How long to wait before reconnecting to a lost outbound peer.
reconnectDelay: "10s"

# ── RPC server ────────────────────────────────────────────────────────────────
# Bind address for the HTTP query interface.
# Set to "" to disable RPC.
#
# Endpoints:
#   GET /status  → connection list (ip, port, direction, uptime, connected_at CST)
#   GET /mempool → all transactions (txid, size, from_peer, received_at CST, raw hex)
#   GET /health  → 200 OK liveness probe
rpcAddr: "127.0.0.1:8888"

# ── Logging ───────────────────────────────────────────────────────────────────
# Logging level: debug | info | warn | error
# All timestamps are in UTC+8 (CST).
# Events logged automatically:
#   - Inbound/outbound connections (ip, port, connected_at CST)
#   - New mempool transactions (txid, size, from_peer, received_at CST)
#   - Chain tip progress during fast-forward and live relay
logLevel: "info"
